<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comunidade City</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0b1020;--card:#161d36;--tx:#eef0fa;--mut:#9aa3c4;--ac:#ff5fa2;--bd:#2a3252;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--bt:.5s}
.hero{position:relative;height:100vh;min-height:560px;overflow:hidden;background:linear-gradient(#070a16,#141c42 55%,#3a2f6b)}
.hero h1{position:absolute;top:24px;left:0;right:0;text-align:center;margin:0;font-size:26px;z-index:6;padding:0 12px}
.sub{position:absolute;top:62px;left:0;right:0;text-align:center;color:var(--mut);z-index:6;padding:0 12px}
.cnt{position:absolute;top:92px;left:0;right:0;text-align:center;z-index:6;font-size:36px;font-weight:700}
.cnt small{display:block;font-size:13px;font-weight:400;color:var(--mut)}
#stars{position:absolute;inset:0 0 40% 0;width:100%;height:60%}
.moon{position:absolute;top:70px;right:8%;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#e8ecff 60%,#b9c2e6);box-shadow:0 0 40px 12px rgba(200,210,255,.35)}
svg.sk{position:absolute;bottom:0;left:0;width:100%;height:62%}
.bl{animation:bk 1.4s infinite}@keyframes bk{50%{opacity:.1}}
.street{position:absolute;left:0;right:0;bottom:0;height:110px;background:linear-gradient(#262c4a 0,#262c4a 30%,#161a2c 30%,#10131f);border-top:2px solid #3a4268}
.street:after{content:"";position:absolute;left:0;right:0;bottom:16px;height:3px;background:repeating-linear-gradient(90deg,#e8e2a0 0 26px,transparent 26px 56px);opacity:.6}
.lamp{position:absolute;bottom:80px;width:3px;height:70px;background:#10131f}
.lamp:before{content:"";position:absolute;top:-6px;left:-26px;width:55px;height:55px;border-radius:50%;background:radial-gradient(rgba(255,217,122,.6),transparent 70%)}
.stage{position:absolute;left:50%;bottom:34px;width:min(70%,380px);height:150px;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 100%,rgba(255,95,162,.6),rgba(90,120,255,.25) 50%,transparent 72%);opacity:0;transition:opacity .6s;animation:hue 2.4s linear infinite;z-index:2}
.live .stage{opacity:1}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.walk{position:absolute;inset:0;z-index:3}
.w{position:absolute;width:14px;height:30px;margin-left:-7px;transform-origin:bottom center;cursor:pointer}
.fig{position:relative;width:14px;height:30px}.fig i{position:absolute;display:block}
.hd{left:3px;top:0;width:8px;height:9px;border-radius:50% 50% 45% 45%;background:var(--sk)}
.w.f .hd:after{content:"";position:absolute;left:-1px;top:3px;width:10px;height:13px;border-radius:2px 2px 6px 6px;background:var(--hr);z-index:-1}
.hd:before{content:"";position:absolute;left:-1px;top:-1px;width:10px;height:5px;border-radius:5px 5px 1px 1px;background:var(--hr)}
.tr{left:2px;top:9px;width:10px;height:11px;border-radius:3px 3px 2px 2px;background:var(--c)}
.ar{top:10px;width:3px;height:10px;border-radius:2px;background:var(--sk);transform-origin:top center;animation:wk .5s ease-in-out infinite alternate}
.a1{left:-1px}.a2{left:12px;animation-direction:alternate-reverse}
.lg{top:19px;width:4px;height:11px;border-radius:2px;background:var(--pt);transform-origin:top;animation:wk .5s ease-in-out infinite alternate}
.l1{left:3px}.l2{left:7px;animation-direction:alternate-reverse}
@keyframes wk{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@keyframes up{from{transform:rotate(155deg)}to{transform:rotate(-155deg)}}
.w.dance .fig{animation:bob var(--bt) ease-in-out infinite alternate;animation-delay:var(--dl)}
.w.dance .ar{animation:up var(--bt) ease-in-out infinite alternate;animation-delay:var(--dl)}
.w.dance .lg{animation-duration:var(--bt)}
.w span{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--bd);padding:2px 8px;border-radius:8px;font-size:12px;white-space:nowrap;display:none}
.w.on span,.w.me span{display:block}
.w.me .fig{filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 8px #fff)}
#bn{position:absolute;left:12px;right:12px;bottom:122px;z-index:7;background:rgba(22,29,54,.92);border:1px solid var(--ac);border-radius:14px;padding:10px 12px;display:none;align-items:center;justify-content:space-between;gap:8px;font-size:14px}
.live #bn{display:flex}
.hint{position:absolute;bottom:6px;left:0;right:0;text-align:center;color:var(--mut);z-index:6;font-size:12px}
section.blk{padding:40px 20px 10px;text-align:center;max-width:620px;margin:0 auto}
.blk h2{margin:0 0 10px;font-size:24px}.blk p{color:var(--mut);margin:0 0 18px}
button,a.bt{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;text-decoration:none;display:inline-block;color:#fff;background:var(--ac);font-size:15px}
.g{background:var(--card);border:1px solid var(--bd);color:var(--tx)}
a.igb{background:linear-gradient(45deg,#f9a03f,#e1306c,#833ab4);padding:14px 26px;font-size:17px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
#fbox{display:none;margin-top:14px}#fbox.on{display:block}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px;margin-bottom:8px;font-family:inherit}
#fr button{display:block;width:100%;margin-top:8px}
#fm{margin-top:12px;font-size:19px;font-weight:700;color:var(--ac)}
.ev{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:8px;text-align:left}
.ev small{color:var(--mut);display:block}
.badge{background:var(--ac);color:#fff;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.adm{max-width:620px;margin:30px auto 90px;padding:16px;background:var(--card);border:1px solid var(--bd);border-radius:14px;width:calc(100% - 32px)}
.adm h3{margin:14px 0 8px}.adm h3:first-child{margin-top:0}
.adm label{display:block;font-size:13px;color:var(--mut);margin:4px 0}
.it{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 0;border-top:1px solid var(--bd);font-size:14px}
.it button{padding:6px 10px;font-size:13px}
.x{background:none;color:#ff6b6b}
.eb{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:99;background:var(--card);border:1px solid var(--bd);border-radius:50%;width:46px;height:46px;font-size:20px;padding:0}
.warn{margin:22px auto 0;max-width:460px;background:rgba(255,193,7,.12);border:1px solid #ffc107;color:#ffd866;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
.fxd{position:absolute;pointer-events:none;opacity:0;transition:opacity .5s}.fxd.on{opacity:1}
#fx-strobe{inset:0;background:#fff;z-index:5;transition:none}
#fx-strobe.on{animation:stb var(--bt) steps(1) infinite alternate}@keyframes stb{from{opacity:0}to{opacity:.12}}
#fx-spots{inset:0;z-index:4;mix-blend-mode:screen;background:radial-gradient(circle at 20% 60%,rgba(255,60,160,.35),transparent 30%),radial-gradient(circle at 80% 50%,rgba(60,160,255,.35),transparent 30%),radial-gradient(circle at 50% 40%,rgba(120,255,120,.25),transparent 30%);animation:hue 3s linear infinite}
#fx-laser{left:50%;bottom:110px;width:0;height:0;z-index:4}
.beam{position:absolute;bottom:0;left:0;width:3px;height:70vh;transform-origin:bottom center;background:linear-gradient(var(--bc),transparent);box-shadow:0 0 8px var(--bc);animation:sw 2.4s ease-in-out infinite alternate;animation-delay:var(--bd)}
@keyframes sw{from{transform:rotate(-55deg)}to{transform:rotate(55deg)}}
#fx-fumaca{left:-10%;right:-10%;bottom:30px;height:150px;z-index:4;filter:blur(12px);background:radial-gradient(ellipse 25% 50% at 15% 70%,rgba(210,215,255,.35),transparent),radial-gradient(ellipse 30% 55% at 45% 60%,rgba(210,215,255,.3),transparent),radial-gradient(ellipse 25% 50% at 80% 70%,rgba(210,215,255,.35),transparent);animation:dr 7s ease-in-out infinite alternate}
@keyframes dr{to{transform:translateX(6%) scaleY(1.2)}}
#fx-disco{top:0;left:12%;width:56px;height:130px;z-index:6}
#fx-disco:before{content:"";position:absolute;left:27px;top:0;width:2px;height:74px;background:#888}
.ball{position:absolute;top:74px;left:0;width:56px;height:56px;border-radius:50%;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 3px,transparent 3px 7px),repeating-linear-gradient(90deg,rgba(0,0,0,.25) 0 3px,transparent 3px 7px),radial-gradient(circle at 35% 30%,#fff,#aab 40%,#445 90%);box-shadow:0 0 30px 8px rgba(255,255,255,.35);animation:gl 1.2s linear infinite}
@keyframes gl{50%{filter:brightness(1.5)}}
input[type=checkbox]{width:auto;margin:0}
.fxrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.fxrow label{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--tx);margin:0}
.fxrow button{padding:8px 10px;font-size:13px}
.fxrow button.on,#qb button.on{background:var(--ac);color:#fff}
#qb{position:fixed;right:10px;justify-content:flex-end;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:99;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 72px)}
#qb button{padding:8px 10px;font-size:18px;border-radius:10px}
#nw{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:150;background:linear-gradient(45deg,#ff5fa2,#833ab4);color:#fff;font-weight:800;font-size:18px;padding:14px 22px;border-radius:16px;box-shadow:0 0 30px #ff5fa2;text-align:center;max-width:90%;animation:pp .6s ease-out}
@keyframes pp{from{transform:translateX(-50%) scale(.6);opacity:0}}
.w.clap .a1{animation:cl1 .28s ease-in-out infinite alternate}
.w.clap .a2{animation:cl2 .28s ease-in-out infinite alternate}
.w.clap .lg{animation:none}
@keyframes cl1{from{transform:rotate(-20deg)}to{transform:rotate(-75deg)}}
@keyframes cl2{from{transform:rotate(20deg)}to{transform:rotate(75deg)}}
.w.clap:after{content:"👏";position:absolute;top:-16px;left:50%;margin-left:-8px;font-size:13px;animation:cp .3s ease-in-out infinite alternate}
@keyframes cp{to{transform:translateY(-4px) scale(1.2)}}
#heli{position:absolute;z-index:8;width:150px;transform:translateX(-50%);pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.rotor{transform-box:fill-box;transform-origin:50% 50%;animation:rt .1s linear infinite alternate}
@keyframes rt{from{transform:scaleX(1)}to{transform:scaleX(.25)}}
#rope{position:absolute;z-index:7;width:2px;background:rgba(255,255,255,.85);transform:translateX(-1px);pointer-events:none}
#carpet{position:absolute;left:6%;right:6%;bottom:12px;height:38px;z-index:2;background:repeating-linear-gradient(90deg,#b3122b 0 40px,#a00f26 40px 80px);border-top:3px solid #ffcf4a;border-bottom:3px solid #ffcf4a;opacity:0;transition:opacity .5s;box-shadow:0 0 20px rgba(255,40,80,.5);pointer-events:none}
#carpet.on{opacity:1}
#carpet:before,#carpet:after{content:"";position:absolute;top:-14px;width:8px;height:52px;background:#ffcf4a;border-radius:3px}
#carpet:before{left:-12px}#carpet:after{right:-12px}
#dj{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);width:min(78%,430px);height:250px;z-index:2;opacity:0;pointer-events:none;transition:opacity .6s;--lv:0}
#dj.on{opacity:1}
.djscreen{position:absolute;top:0;left:12%;right:12%;height:62px;background:#0a0e22;border:2px solid #ff5fa2;border-radius:8px;box-shadow:0 0 calc(10px + var(--lv)*26px) #ff5fa2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.djscreen b{font-size:13px;letter-spacing:2px;color:#fff}
#dj-eq{display:flex;gap:3px;align-items:flex-end;height:26px;width:80%}
#dj-eq i{flex:1;background:linear-gradient(#ff5fa2,#2de2ff);border-radius:2px;height:20%}
#dj-beams{position:absolute;top:62px;left:0;right:0;height:150px;opacity:.5}
#dj-beams i{position:absolute;top:0;width:70px;height:150px;transform-origin:50% 0;clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);background:linear-gradient(var(--bc),transparent);animation:bs 2s ease-in-out infinite alternate}
#dj-beams i:nth-child(1){left:2%;--bc:#ff2d95}#dj-beams i:nth-child(2){left:28%;--bc:#2de2ff;animation-delay:-.5s}
#dj-beams i:nth-child(3){left:54%;--bc:#7dff2d;animation-delay:-1s}#dj-beams i:nth-child(4){left:78%;--bc:#b32dff;animation-delay:-1.5s}
@keyframes bs{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
#djimg{position:absolute;left:calc(50% - 66px);bottom:34px;height:120px;transform-origin:50% 100%;filter:drop-shadow(0 0 10px rgba(255,95,162,.7))}
.djdeck{position:absolute;left:18%;right:18%;bottom:26px;height:26px;background:linear-gradient(#222a4a,#10142a);border:1px solid #3a4268;border-radius:6px;display:flex;justify-content:space-around;align-items:center}
.djdeck u{width:20px;height:20px;border-radius:50%;background:radial-gradient(#555 22%,#111 24%);border:1px solid #888;animation:spn 1s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}
.djfloor{position:absolute;left:0;right:0;bottom:0;height:28px;background:linear-gradient(#2b3260,#10142a);border-radius:6px 6px 0 0;box-shadow:0 -4px calc(10px + var(--lv)*30px) rgba(255,95,162,.8)}
#qb button:not(.mf){font-size:13px}
.gl3 #stars,.gl3 .moon,.gl3 #sk,.gl3 #st,.gl3 .stage,.gl3 #carpet,.gl3 #dj,.gl3 #heli,.gl3 #rope,.gl3 #fx-laser,.gl3 #fx-strobe,.gl3 #fx-spots,.gl3 #fx-disco,.gl3 .fig{display:none!important}
.gl3 .w{margin:0;width:20px;height:40px}
.gl3 .w span{bottom:100%;margin-bottom:6px}
#bn{left:12px!important;right:auto!important;bottom:auto!important;top:12px!important;background:none!important;border:0!important;padding:0!important}
#bt{display:none}
#rec.on{background:#e5484d;color:#fff}
#qb #rec{position:fixed;left:66px;bottom:calc(12px + env(safe-area-inset-bottom,0px));height:46px;padding:0 16px;border-radius:23px;font-size:14px}
[hidden]{display:none!important}
</style>
</head>
